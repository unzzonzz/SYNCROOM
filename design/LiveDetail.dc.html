    .txtbtn { font-size: 13px; font-weight: 600; letter-spacing: -0.3px; color: #6E6E68; }

    .msg-av { width: 26px; height: 26px; border-radius: 13px; background: #E2E2DC; flex: none; }
    .msg-t { min-width: 0; font-size: 14px; line-height: 18px; letter-spacing: -0.3px; }
